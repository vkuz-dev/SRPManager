name: Build and Release

on:
  push:
    tags:
      - "v*"  # Release builds are driven by version tags, e.g. v2.2.4
  workflow_dispatch:

permissions:
  contents: write # Required to create the GitHub release and attach the binary


jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore AWLM.sln

      - name: Build Solution
        run: msbuild AWLM.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/bin/Release/**/*.exe
